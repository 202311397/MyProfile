baseURL: https://202311397.github.io/MyProfile/
locale: ko-KR
defaultContentLanguage: ko
defaultContentLanguageInSubdir: false  

languages:
  ko:
    label: 한국어
    locale: ko-KR
    contentDir: content/ko
    title: "강민아 포트폴리오"           
    weight: 1
    params:
      logo:
        name: "강민아"                  
        dot: true
      error_404:
        title: "페이지를 찾을 수 없습니다"
        description: "주소가 바뀌었거나 존재하지 않는 페이지입니다. 홈으로 돌아가거나 아래 링크를 이용해 주세요."
        show_search: false
        show_links: true
        show_recent_posts: false
      footer:
        description: "기록하는 개인 포트폴리오"   
        columns:
          - title: "바로가기"
            links:
              - name: "소개"
                url: "https://202311397.github.io/MyProfile/about/"
              - name: "활동"
                url: "https://202311397.github.io/MyProfile/gallery/"
              - name: "학습 기록"
                url: "https://202311397.github.io/MyProfile/blog/"
          - title: "링크"
            links:
              - name: "GitHub"
                url: "https://github.com/202311397"   # ★ 실제 GitHub 아이디 확인
                external: true
        show_credit: true          # 테마 제작자 표기 유지 (P58)
    menu:
      main:
        - name: "소개"
          pageRef: /about
          weight: 1
        - name: "활동"
          pageRef: /gallery
          weight: 2
        - name: "학습 기록"
          pageRef: /blog
          weight: 3

module:
  imports:
    - path: github.com/maciejkosiarski/localcraft

taxonomies:
  tag: tags
  category: categories

pagination:
  pagerSize: 6

params:
  logo:
    name: "강민아"                      
    dot: true

  business:
    name: "강민아"                       
    type: "Person"                       
    country: "KR"                         
  support_button:
    enabled: false                        
  announcement:
    enabled: false                    
  images:
    quality: 80
    widths: [400, 800, 1200, 1600]
    lazy_loading: true
